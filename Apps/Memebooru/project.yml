name: Memebooru
options:
  bundleIdPrefix: dev.mrmacduckinson
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  MemebooruPackage:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Memebooru:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Memebooru
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: ""
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mrmacduckinson.memebooru
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Memebooru.entitlements
        # MBFFmpeg.xcframework ships arm64 simulator code only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - package: MemebooruPackage
        product: MemebooruCore
      - package: MemebooruPackage
        product: MemebooruPlatformApple
      - target: MemebooruShare
        platformFilter: iOS
        embed: true
      # In-process FFmpeg for iOS (scripts/build-ffmpeg-ios.sh) and what it links against.
      - framework: ../../Vendor/ffmpeg-ios/MBFFmpeg.xcframework
        embed: false
        platformFilter: iOS
      - sdk: VideoToolbox.framework
        platformFilter: iOS
      - sdk: AudioToolbox.framework
        platformFilter: iOS
      - sdk: CoreMedia.framework
        platformFilter: iOS
      - sdk: CoreVideo.framework
        platformFilter: iOS
      - sdk: libz.tbd
        platformFilter: iOS
      - sdk: libbz2.tbd
        platformFilter: iOS
    postBuildScripts:
      # Bundles our own ffmpeg/ffprobe (scripts/build-ffmpeg-macos.sh) into Contents/Helpers on macOS.
      # Without them the app still runs; converting and uncommon-video previews are then unavailable
      # (unless Homebrew's ffmpeg is installed).
      - name: Embed ffmpeg
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../Vendor/ffmpeg/bin/ffmpeg
          - $(SRCROOT)/../../Vendor/ffmpeg/bin/ffprobe
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ffmpeg
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ffprobe
        script: |
          [ "$PLATFORM_NAME" = "macosx" ] || exit 0
          SRC="$SRCROOT/../../Vendor/ffmpeg/bin"
          if [ ! -x "$SRC/ffmpeg" ]; then echo "warning: ffmpeg not built — run scripts/build-ffmpeg-macos.sh"; exit 0; fi
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          # Already ad-hoc signed by the linker; the app's own signing covers the bundle.
          cp -f "$SRC/ffmpeg" "$SRC/ffprobe" "$DEST/"
  # Unit tests hosted in the app, on macOS and the iOS Simulator.
  MemebooruAppTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Tests
    dependencies:
      # MemebooruCore comes from the app it runs in: linking it here too loads two copies of every class.
      - target: Memebooru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mrmacduckinson.memebooru.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Memebooru.app/Contents/MacOS/Memebooru
        "TEST_HOST[sdk=iphone*]": $(BUILT_PRODUCTS_DIR)/Memebooru.app/Memebooru
        BUNDLE_LOADER: $(TEST_HOST)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # The app as UI tests drive it: the same sources under its own bundle id, so a test run never quits
  # (or shares preferences with) the Memebooru you have open. Built for the UI tests only.
  MemebooruUITestHost:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MemebooruPackage
        product: MemebooruCore
      - package: MemebooruPackage
        product: MemebooruPlatformApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mrmacduckinson.memebooru.uitesthost
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
  # macOS UI tests (XCUITest). Each test seeds a throwaway collection and launches the host with
  # `-uiTestCollection <path>`; run with the MemebooruUITests scheme (they take over mouse and keyboard).
  MemebooruUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: MemebooruUITestHost
      - package: MemebooruPackage
        product: MemebooruCore
      - package: MemebooruPackage
        product: MemebooruPlatformApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mrmacduckinson.memebooru.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MemebooruUITestHost
  MemebooruShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: MemebooruPackage
        product: MemebooruCore
      - package: MemebooruPackage
        product: MemebooruPlatformApple
    info:
      path: Resources/MemebooruShare-Info.plist
      properties:
        CFBundleDisplayName: Memebooru
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mrmacduckinson.memebooru.share
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/MemebooruShare.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Memebooru:
    build:
      targets:
        Memebooru: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemebooruAppTests
  MemebooruUITests:
    build:
      targets:
        MemebooruUITestHost: [test]
        MemebooruUITests: [test]
    test:
      config: Debug
      targets:
        - MemebooruUITests
